server:
  port: ${SERVER_PORT:8086}

spring:
  application:
    name: adaptive-learning-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://config-server:8888}
  cloud:
    config:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:mysql://mysql:3306/smartlingua?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:smartlingua}
    password: ${DB_PASSWORD:smartlingua}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    table: flyway_schema_history_adaptive
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak:8080/realms/smartlingua}

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://discovery-server:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,refresh

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost}

adaptive:
  ai:
    enabled: ${ADAPTIVE_AI_ENABLED:false}
  security:
    relaxed-student-check: true
  scheduler:
    difficulty:
      enabled: true
      cron: "0 */10 * * * *"
    recommendation:
      enabled: true
      cron: "0 15 * * * *"
    simple-progress:
      enabled: true
      cron: "0 25 * * * *"
